<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}} — 视频讲义</title>
<style>
:root{
  --bg:#0a0a0a; --surface:#141414; --fg:#fff;
  --fg2:rgba(255,255,255,.72); --fg3:rgba(255,255,255,.48);
  --brand:#6799fe; --bd:rgba(255,255,255,.09);
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);line-height:1.8;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;
  max-width:820px;margin:0 auto;padding:48px 24px 100px;
  -webkit-font-smoothing:antialiased}

.meta{font-family:var(--mono);font-size:11px;color:var(--fg3);
  letter-spacing:.5px;display:flex;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.meta .k{color:var(--brand)}

h1{font-size:clamp(28px,4.5vw,40px);font-weight:600;line-height:1.25;
  letter-spacing:-1px;margin-bottom:16px}
.dek{font-size:16px;color:var(--fg2);padding-bottom:28px;
  border-bottom:1px solid var(--bd)}

h2{font-size:22px;font-weight:600;letter-spacing:-.3px;
  margin:48px 0 16px;padding-bottom:10px;border-bottom:1px solid var(--bd)}
h3{font-size:17px;font-weight:600;color:var(--fg2);margin:28px 0 10px}
p{margin:0 0 18px;font-size:15.5px;color:var(--fg2)}

.ts{display:inline-block;font-family:var(--mono);font-size:11px;
  color:var(--brand);background:rgba(103,153,254,.1);
  border:1px solid rgba(103,153,254,.25);border-radius:4px;
  padding:1px 7px;margin-right:8px;vertical-align:middle}

blockquote{border-left:2px solid var(--brand);padding:6px 0 6px 18px;
  margin:24px 0;color:var(--fg2);font-size:15.5px}
blockquote cite{display:block;font-size:12px;color:var(--fg3);
  font-style:normal;margin-top:8px;font-family:var(--mono)}

figure{margin:28px 0}
figure img{width:100%;border:1px solid var(--bd);border-radius:10px;display:block}
figcaption{font-size:12px;color:var(--fg3);margin-top:8px;text-align:center}

code{font-family:var(--mono);font-size:.9em;background:var(--surface);
  border:1px solid var(--bd);border-radius:4px;padding:1px 5px;color:#c8d6ff}
pre{background:var(--surface);border:1px solid var(--bd);border-radius:10px;
  padding:16px;overflow-x:auto;margin:20px 0}
pre code{background:none;border:0;padding:0;font-size:13px;color:#d4d4d4}

ul,ol{margin:0 0 20px;padding-left:22px;color:var(--fg2)}
li{margin:6px 0;font-size:15.5px}

/* 证据来源标注 */
.evidence{font-size:12px;color:var(--fg3);font-family:var(--mono);
  border:1px dashed var(--bd);border-radius:6px;padding:8px 12px;
  margin:16px 0;line-height:1.6}

footer{margin-top:60px;padding-top:24px;border-top:1px solid var(--bd);
  font-size:12px;color:var(--fg3);text-align:center}
</style>
</head>
<body>

<div class="meta">
  <span class="k">视频讲义</span>
  <span>{{DATE}}</span>
  <span>{{DURATION}}</span>
  <span>{{PLATFORM}}</span>
</div>

<h1>{{TITLE}}</h1>
<p class="dek">{{SUMMARY}}</p>

{{CONTENT}}

<footer>
  由 video-analyzer 生成 · 分析方式：{{METHOD}}<br>
  <span style="opacity:.6">{{SOURCE_URL}}</span>
</footer>

</body>
</html>
